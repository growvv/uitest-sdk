name: pages
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Keyed by ref, not a single `pages` group: a pull request's test run must not
  # cancel a deploy that is already publishing master.
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The unit suite is the only automated check the package has, and until now
  # it ran only from prepublishOnly — so a broken commit could reach master and
  # a green deploy said nothing about whether the code worked. Run it first and
  # make the deploy depend on it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # typecheck is a subset of build, but it is the step that fails fastest
      # and names the offending file, so keep it visible on its own.
      - run: npm run typecheck
      # `typecheck` only covers src/ (rootDir), which let 27 errors pile up in
      # test/ unseen. This project file adds test/ and scripts/ to the same
      # strict settings so they cannot drift again.
      - run: npm run typecheck:tests
      # One-way edges: core never imports a product, a product never imports
      # another product, no deep imports into dist/ or src/. The checker
      # accepts a missing packages/ tree, so this is live from the first split.
      - run: node scripts/check-layers.mjs
      # Site links and version banners were only checked at deploy time, so a
      # PR could merge a site that the deploy job would then refuse to publish.
      - run: node scripts/check-site.mjs
      # The skill is the only documentation an agent reads before calling the
      # CLI; a command without a row is a call it may make and lose.
      - run: node scripts/check-skill.mjs
      - run: npm test
  deploy:
    needs: test
    # A pull request should be tested, never published: deploying a PR branch
    # would replace the live site with unmerged work.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-site.mjs validates api.html against the built catalog, so the
      # build must happen first. dist/ is gitignored and never in the checkout.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
